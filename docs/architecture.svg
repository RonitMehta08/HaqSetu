<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HaqSetu agent architecture</title>
  <desc id="desc">A guarded flow from profile intake through retrieval, rule evidence, counterfactuals, action planning, and consent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbf7"/><stop offset="1" stop-color="#e9f4ee"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop stop-color="#164f46"/><stop offset="1" stop-color="#287c6b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#174d42" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5f9e8e"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" fill="#103e36" font-family="Arial, sans-serif" font-size="32" font-weight="700">HaqSetu · Evidence-first agent loop</text>
  <text x="64" y="102" fill="#5d766e" font-family="Arial, sans-serif" font-size="16">Understand → Retrieve → Reason → Verify → Act safely</text>
  <g filter="url(#shadow)">
    <rect x="64" y="170" width="190" height="110" rx="18" fill="url(#node)"/>
    <rect x="294" y="170" width="190" height="110" rx="18" fill="url(#node)"/>
    <rect x="524" y="170" width="190" height="110" rx="18" fill="url(#node)"/>
    <rect x="754" y="170" width="190" height="110" rx="18" fill="url(#node)"/>
    <rect x="984" y="170" width="150" height="110" rx="18" fill="#b7e57c"/>
  </g>
  <g fill="white" font-family="Arial, sans-serif">
    <text x="88" y="207" font-size="13" opacity=".8">01</text><text x="88" y="238" font-size="20" font-weight="700">Intake</text><text x="88" y="263" font-size="12" opacity=".8">broad facts + need</text>
    <text x="318" y="207" font-size="13" opacity=".8">02</text><text x="318" y="238" font-size="20" font-weight="700">Discover</text><text x="318" y="263" font-size="12" opacity=".8">rank source cards</text>
    <text x="548" y="207" font-size="13" opacity=".8">03</text><text x="548" y="238" font-size="20" font-weight="700">Reason</text><text x="548" y="263" font-size="12" opacity=".8">test explicit rules</text>
    <text x="778" y="207" font-size="13" opacity=".8">04</text><text x="778" y="238" font-size="20" font-weight="700">Verify</text><text x="778" y="263" font-size="12" opacity=".8">evidence + what-if</text>
    <text x="1008" y="207" fill="#173d35" font-size="13" opacity=".7">05</text><text x="1008" y="238" fill="#173d35" font-size="20" font-weight="700">Act</text><text x="1008" y="263" fill="#173d35" font-size="12" opacity=".7">consent gate</text>
  </g>
  <g stroke="#5f9e8e" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M254 225h35"/><path d="M484 225h35"/><path d="M714 225h35"/><path d="M944 225h35"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="160" y="390" width="260" height="120" rx="18" fill="#fffefa" stroke="#d6e1da"/>
    <rect x="470" y="390" width="260" height="120" rx="18" fill="#fffefa" stroke="#d6e1da"/>
    <rect x="780" y="390" width="260" height="120" rx="18" fill="#fffefa" stroke="#d6e1da"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#284b42">
    <text x="188" y="425" font-size="16" font-weight="700">Evidence ledger</text><text x="188" y="452" font-size="13">matched · missing · not matched</text><text x="188" y="476" font-size="13" fill="#6b8179">official URL + freshness note</text>
    <text x="498" y="425" font-size="16" font-weight="700">Counterfactuals</text><text x="498" y="452" font-size="13">what could change the signal?</text><text x="498" y="476" font-size="13" fill="#6b8179">never invent a qualification</text>
    <text x="808" y="425" font-size="16" font-weight="700">Safe delivery</text><text x="808" y="452" font-size="13">action plan + local draft</text><text x="808" y="476" font-size="13" fill="#6b8179">human confirms before action</text>
  </g>
  <g stroke="#aac6ba" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M619 280v70H290v34"/><path d="M619 280v70h291v34"/></g>
  <text x="64" y="575" fill="#628078" font-family="Arial, sans-serif" font-size="13">Deterministic baseline · no API key · no credential collection · no automatic submission</text>
</svg>
